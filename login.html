<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – SportClub</title>
  <style>
    :root {
      --purple-dark: #2e1a47;
      --purple-mid: #3f2561;
      --purple-accent: #7c3aed;
      --text-muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f0edf6; font-family: 'Segoe UI', sans-serif;
    }
    .login-container {
      display: flex; width: 920px; height: 560px;
      background: white; border-radius: 24px; overflow: hidden;
      box-shadow: 0 25px 70px rgba(46,26,71,0.18);
    }
    .login-image {
      flex: 1;
      background: linear-gradient(160deg, #2e1a47 0%, #7c3aed 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; padding: 50px; text-align: center; gap: 16px;
    }
    .login-image .brand { font-size: 1rem; letter-spacing: 4px; opacity: 0.7; text-transform: uppercase; }
    .login-image h2 { font-size: 3rem; font-weight: 900; line-height: 1.1; }
    .login-image p { opacity: 0.8; font-size: 1rem; max-width: 220px; }
    .decorative-circles { position: relative; width: 120px; height: 120px; margin-top: 10px; }
    .decorative-circles span { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); }
    .decorative-circles span:nth-child(1) { width: 120px; height: 120px; top: 0; left: 0; }
    .decorative-circles span:nth-child(2) { width: 80px; height: 80px; top: 20px; left: 20px; background: rgba(255,255,255,0.07); }
    .decorative-circles span:nth-child(3) { width: 40px; height: 40px; top: 40px; left: 40px; background: rgba(255,255,255,0.15); }
    .login-form-side {
      flex: 1; padding: 55px 50px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .auth-logo { height: 52px; margin-bottom: 28px; align-self: center; }
    .login-form-side h1 { font-size: 2rem; color: var(--purple-dark); text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.93rem; }
    #error-message {
      color: #c0392b; background: #fdeaea; padding: 11px 14px;
      border-radius: 10px; margin-bottom: 18px; text-align: center;
      display: none; font-size: 0.88rem; border: 1px solid #f5c6cb;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--purple-dark); margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-group input {
      width: 100%; padding: 13px 16px; border: 2px solid #ece8f4;
      border-radius: 12px; font-size: 0.97rem; background: #faf9fd;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .form-group input:focus {
      border-color: var(--purple-accent); outline: none;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .btn-login-submit {
      width: 100%; padding: 14px; margin-top: 6px;
      background: linear-gradient(135deg, var(--purple-dark), var(--purple-accent));
      color: white; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 800; letter-spacing: 1px;
      cursor: pointer; transition: opacity 0.2s, transform 0.2s;
    }
    .btn-login-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    .auth-links { margin-top: 24px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
    .auth-links a { text-decoration: none; color: var(--text-muted); font-size: 0.88rem; transition: color 0.2s; }
    .auth-links a:hover { color: var(--purple-accent); }
    .auth-links a strong { color: var(--purple-dark); }
    @media (max-width: 860px) {
      .login-image { display: none; }
      .login-container { width: 95%; height: auto; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-image">
      <span class="brand">SportClub</span>
      <h2>¡Hola de nuevo!</h2>
      <p>Es un excelente día para superar tus límites.</p>
      <div class="decorative-circles">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="login-form-side">
      <img src="img/logo_empresa_letra_v1.png" alt="SportClub" class="auth-logo">
      <h1>Bienvenido</h1>
      <p class="subtitle">Ingresa tus credenciales para continuar</p>
      <div id="error-message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">CORREO ELECTRÓNICO</label>
          <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">CONTRASEÑA</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login-submit">INGRESAR</button>
      </form>
      <div class="auth-links">
        <a href="index.html">← Volver al inicio</a>
        <a href="register.html">¿No tienes cuenta? <strong>Regístrate gratis</strong></a>
      </div>
    </div>
  </div>
  <script src="JS/script.js"></script>
</body>
</html>
