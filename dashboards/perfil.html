<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil – SportClub</title>
  <style>
    :root {
      --purple-dark: #2e1a47;
      --purple-accent: #7c3aed;
      --sidebar-bg: #1a1a2e;
      --bg: #f0edf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px; background: var(--sidebar-bg); color: white;
      display: flex; flex-direction: column; padding: 30px 0;
      position: fixed; top: 0; left: 0; height: 100vh;
    }
    .sidebar-brand { padding: 0 24px 30px; font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; color: white; }
    .sidebar-brand span { color: var(--purple-accent); }
    .sidebar-user { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-user .name { font-weight: 700; font-size: 0.95rem; }
    .sidebar-user .role-txt { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .sidebar nav { flex: 1; padding-top: 20px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px; color: rgba(255,255,255,0.65);
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
      transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%;
    }
    .nav-item:hover { background: #16213e; color: white; }
    .nav-item.active { background: var(--purple-accent); color: white; }
    .nav-item .icon { font-size: 1.1rem; width: 20px; text-align: center; }
    .sidebar-footer { padding: 20px 24px; }
    .btn-logout-side {
      width: 100%; padding: 10px; background: rgba(124,58,237,0.2);
      color: var(--purple-accent); border: 1px solid rgba(124,58,237,0.4);
      border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: background 0.2s;
    }
    .btn-logout-side:hover { background: rgba(124,58,237,0.4); }

    .main { margin-left: 220px; flex: 1; padding: 36px; }
    .page-header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
    .page-header div h1 { font-size: 1.6rem; color: #1a1a2e; font-weight: 900; }
    .page-header div p { color: #888; font-size: 0.9rem; margin-top: 4px; }

    .profile-grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }

    .profile-card {
      background: white; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07); padding: 28px; text-align: center;
    }
    .avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-dark), var(--purple-accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: white; margin: 0 auto 16px;
    }
    .profile-card .pname { font-size: 1.2rem; font-weight: 900; color: #1a1a2e; margin-bottom: 4px; }
    .profile-card .prole { font-size: 0.8rem; color: #888; margin-bottom: 12px; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-admin { background: #fdeaea; color: #c0392b; }
    .badge-coach { background: #eaf4fd; color: #2980b9; }
    .badge-user  { background: #eafaf1; color: #1e8449; }
    .profile-info { margin-top: 20px; text-align: left; }
    .info-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0edf6; }
    .info-item:last-child { border-bottom: none; }
    .info-item .iicon { font-size: 1rem; margin-top: 2px; }
    .info-item .ilabel { font-size: 0.72rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-item .ivalue { font-size: 0.88rem; color: #333; font-weight: 600; margin-top: 1px; }

    .right-col { display: flex; flex-direction: column; gap: 24px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); padding: 28px; }
    .card h2 { font-size: 1rem; color: #1a1a2e; font-weight: 900; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #f0edf6; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--purple-dark); margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 11px 14px; border: 2px solid #eee;
      border-radius: 10px; font-size: 0.92rem; background: #fafafa;
      transition: border-color 0.2s; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--purple-accent); outline: none; }
    .form-group input.invalid { border-color: #e74c3c; background: #fff8f8; }
    .form-group input:disabled { background: #f5f5f5; color: #999; cursor: not-allowed; }
    .field-error { color: #e74c3c; font-size: 0.76rem; margin-top: 4px; display: none; }
    .field-error.visible { display: block; }
    .form-row { display: flex; gap: 14px; }
    .form-row .form-group { flex: 1; }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
    .btn-save {
      padding: 11px 24px; background: #27ae60; color: white;
      border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.88rem; transition: opacity 0.2s;
    }
    .btn-save:hover { opacity: 0.85; }
    .btn-cancel-inline {
      padding: 11px 24px; border: 2px solid #eee; background: white;
      border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.88rem;
    }

    .feedback {
      padding: 11px 16px; border-radius: 10px; margin-bottom: 14px;
      font-weight: 600; font-size: 0.85rem; display: none;
    }
    .feedback.success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; display: block; }
    .feedback.error   { background: #fdeaea; color: #c0392b; border: 1px solid #f5c6cb; display: block; }

    .hint { font-size: 0.78rem; color: #aaa; margin-top: 6px; }
  </style>
</head>
<body onload="initPerfil()">

  <aside class="sidebar">
    <div class="sidebar-brand">⚡ SPORT<span>CLUB</span></div>
    <div class="sidebar-user">
      <div class="name" id="sidebar-name">...</div>
      <div class="role-txt" id="sidebar-role">...</div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="btn-logout-side" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>👤 Mi Perfil</h1>
        <p>Gestiona tu información personal</p>
      </div>
    </div>

    <div class="profile-grid">

      <div class="profile-card">
        <div class="avatar" id="avatar-initials">?</div>
        <div class="pname" id="p-nombre">...</div>
        <div class="prole">Usuario del Sistema</div>
        <span class="badge" id="p-badge">...</span>
        <div class="profile-info">
          <div class="info-item">
            <span class="iicon">✉️</span>
            <div>
              <div class="ilabel">Email</div>
              <div class="ivalue" id="p-email">...</div>
            </div>
          </div>
          <div class="info-item">
            <span class="iicon">📅</span>
            <div>
              <div class="ilabel">Fecha de nacimiento</div>
              <div class="ivalue" id="p-birth">—</div>
            </div>
          </div>
          <div class="info-item">
            <span class="iicon">🛡️</span>
            <div>
              <div class="ilabel">Rol</div>
              <div class="ivalue" id="p-rol">...</div>
            </div>
          </div>
          <div class="info-item">
            <span class="iicon">🗓️</span>
            <div>
              <div class="ilabel">Fecha de registro</div>
              <div class="ivalue" id="p-created">...</div>
            </div>
          </div>
        </div>
      </div>

      <div class="right-col">

        <div class="card">
          <h2>✏️ Datos Personales</h2>
          <div class="feedback" id="fb-perfil"></div>
          <div class="form-row">
            <div class="form-group">
              <label>Nombre completo *</label>
              <input type="text" id="e-full_name">
              <span class="field-error" id="err-full_name"></span>
            </div>
            <div class="form-group">
              <label>Email (no editable)</label>
              <input type="email" id="e-email" disabled>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Fecha de nacimiento</label>
              <input type="date" id="e-birth_date">
            </div>
            <div class="form-group">
              <label>Rol (no editable)</label>
              <input type="text" id="e-role" disabled>
            </div>
          </div>
          <div class="form-group">
            <label>Otros / Metadata</label>
            <textarea id="e-metadata" rows="3" placeholder="Intereses, habilidades, etc." style="resize:vertical;"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn-save" onclick="guardarPerfil()">✔ Guardar cambios</button>
          </div>
        </div>

        <div class="card">
          <h2>🔒 Cambiar Contraseña</h2>
          <div class="feedback" id="fb-pass"></div>
          <p class="hint" style="margin-bottom:16px;">La contraseña debe tener al menos 8 caracteres e incluir letras y números.</p>
          <div class="form-row">
            <div class="form-group">
              <label>Contraseña actual *</label>
              <input type="password" id="p-current" placeholder="Tu contraseña actual">
              <span class="field-error" id="err-current"></span>
            </div>
            <div class="form-group">
              <label>Nueva contraseña *</label>
              <input type="password" id="p-new" placeholder="Mín. 8 caracteres">
              <span class="field-error" id="err-new"></span>
            </div>
            <div class="form-group">
              <label>Confirmar nueva *</label>
              <input type="password" id="p-confirm" placeholder="Repetir nueva contraseña">
              <span class="field-error" id="err-pconfirm"></span>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-save" onclick="cambiarPassword()">🔒 Actualizar contraseña</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="../JS/script.js"></script>
  <script>
    const API = 'http://localhost:3000';

    function getToken() { return localStorage.getItem('token'); }

function formatFecha(f) {
    if (!f) return '—';
    const [year, month, day] = f.split('T')[0].split('-');
    return `${day}/${month}/${year}`;
}

    function badgeRol(rol) {
      const clases = { admin: 'badge-admin', coach: 'badge-coach', user: 'badge-user' };
      return clases[rol] || 'badge-user';
    }

    function mostrarFeedback(id, msg, tipo) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = `feedback ${tipo}`;
      setTimeout(() => { el.className = 'feedback'; }, 4000);
    }

    function renderSidebar(rol) {
      const nav = document.getElementById('sidebar-nav');
      const links = {
        admin: [
          { href: 'dashboard-admin.html', icon: '🏠', label: 'Dashboard' },
          { href: 'dashboard-admin.html', icon: '👥', label: 'Usuarios' },
          { href: 'perfil.html',          icon: '👤', label: 'Mi Perfil', active: true }
        ],
        coach: [
          { href: 'dashboard-coach.html', icon: '🏠', label: 'Dashboard' },
          { href: 'perfil.html',          icon: '👤', label: 'Mi Perfil', active: true }
        ],
        user: [
          { href: 'dashboard-user.html',  icon: '🏠', label: 'Dashboard' },
          { href: 'perfil.html',          icon: '👤', label: 'Mi Perfil', active: true }
        ]
      };
      const items = links[rol] || links.user;
      nav.innerHTML = items.map(l => `
        <a class="nav-item ${l.active ? 'active' : ''}" href="${l.href}">
          <span class="icon">${l.icon}</span> ${l.label}
        </a>
      `).join('');
    }

    async function initPerfil() {
      const token = getToken();
      const userData = localStorage.getItem('user');
      if (!token || !userData) { window.location.href = '../index.html'; return; }

      const userLocal = JSON.parse(userData);
      document.getElementById('sidebar-name').textContent = userLocal.full_name;
      document.getElementById('sidebar-role').textContent = userLocal.role;
      renderSidebar(userLocal.role);

      try {
        const res = await fetch(`${API}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!data.ok) { window.location.href = '../index.html'; return; }

        const u = data.data;

        document.getElementById('avatar-initials').textContent = u.full_name.charAt(0).toUpperCase();
        document.getElementById('p-nombre').textContent  = u.full_name;
        document.getElementById('p-email').textContent   = u.email;
        document.getElementById('p-rol').textContent     = u.role;
        document.getElementById('p-birth').textContent   = formatFecha(u.birth_date);
        document.getElementById('p-created').textContent = formatFecha(u.createdAt);

        const badge = document.getElementById('p-badge');
        badge.textContent = u.role;
        badge.className = `badge ${badgeRol(u.role)}`;

        document.getElementById('e-full_name').value  = u.full_name;
        document.getElementById('e-email').value      = u.email;
        document.getElementById('e-role').value       = u.role;
        document.getElementById('e-birth_date').value = u.birth_date || '';
        document.getElementById('e-metadata').value   = u.metadata?.otros || '';

      } catch {
        window.location.href = '../index.html';
      }
    }

async function guardarPerfil() {
    const nombre = document.getElementById('e-full_name').value.trim();
    const errEl  = document.getElementById('err-full_name');
    const inEl   = document.getElementById('e-full_name');

    errEl.textContent = ''; errEl.classList.remove('visible'); inEl.classList.remove('invalid');

    if (!nombre || nombre.length < 3) {
        errEl.textContent = 'El nombre es obligatorio (mín. 3 caracteres).';
        errEl.classList.add('visible'); inEl.classList.add('invalid');
        return;
    }

    const user = JSON.parse(localStorage.getItem('user'));

    const payload = {
        full_name:  nombre,
        birth_date: document.getElementById('e-birth_date').value || null,
        metadata:   { otros: document.getElementById('e-metadata').value.trim() }
    };

    try {
        const res = await fetch(`${API}/api/users/${user.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
            const updatedUser = { ...user, full_name: data.data.full_name, birth_date: data.data.birth_date };
            localStorage.setItem('user', JSON.stringify(updatedUser));
            document.getElementById('p-nombre').textContent = data.data.full_name;
            document.getElementById('sidebar-name').textContent = data.data.full_name;
            document.getElementById('avatar-initials').textContent = data.data.full_name.charAt(0).toUpperCase();
            document.getElementById('p-birth').textContent = formatFecha(data.data.birth_date);
            mostrarFeedback('fb-perfil', '✅ Perfil actualizado correctamente.', 'success');
        } else {
            mostrarFeedback('fb-perfil', data.message || 'Error al actualizar.', 'error');
        }
    } catch {
        mostrarFeedback('fb-perfil', 'Error de conexión con el servidor.', 'error');
    }
}

    async function cambiarPassword() {
      const current = document.getElementById('p-current').value;
      const newPass  = document.getElementById('p-new').value;
      const confirm  = document.getElementById('p-confirm').value;

      ['current','new','pconfirm'].forEach(f => {
        document.getElementById(`err-${f}`).textContent = '';
        document.getElementById(`err-${f}`).classList.remove('visible');
      });
      ['p-current','p-new','p-confirm'].forEach(f => document.getElementById(f).classList.remove('invalid'));

      let hasError = false;

      if (!current) {
        document.getElementById('err-current').textContent = 'Ingresa tu contraseña actual.';
        document.getElementById('err-current').classList.add('visible');
        document.getElementById('p-current').classList.add('invalid');
        hasError = true;
      }
      if (!newPass || newPass.length < 8) {
        document.getElementById('err-new').textContent = 'Contraseña mínimo 8 caracteres.';
        document.getElementById('err-new').classList.add('visible');
        document.getElementById('p-new').classList.add('invalid');
        hasError = true;
      } else if (!/^(?=.*[a-zA-Z])(?=.*\d).+$/.test(newPass)) {
        document.getElementById('err-new').textContent = 'Debe contener letras y números.';
        document.getElementById('err-new').classList.add('visible');
        document.getElementById('p-new').classList.add('invalid');
        hasError = true;
      }
      if (newPass !== confirm) {
        document.getElementById('err-pconfirm').textContent = 'Las contraseñas no coinciden.';
        document.getElementById('err-pconfirm').classList.add('visible');
        document.getElementById('p-confirm').classList.add('invalid');
        hasError = true;
      }
      if (hasError) return;

      try {
        const res = await fetch(`${API}/api/auth/me/password`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
          body: JSON.stringify({ current_password: current, new_password: newPass })
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('p-current').value = '';
          document.getElementById('p-new').value = '';
          document.getElementById('p-confirm').value = '';
          mostrarFeedback('fb-pass', '✅ Contraseña actualizada correctamente.', 'success');
        } else {
          mostrarFeedback('fb-pass', data.message || 'Error al cambiar contraseña.', 'error');
        }
      } catch {
        mostrarFeedback('fb-pass', 'Error de conexión con el servidor.', 'error');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
